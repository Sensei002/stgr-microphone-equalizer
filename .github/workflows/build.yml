name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch VST3 SDK (header-only interfaces)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "third_party" | Out-Null
          # pluginterfaces (the VST3 interface headers) is a submodule of
          # vst3sdk; a plain clone leaves it empty.
          git clone --depth 1 --recurse-submodules -j 4 https://github.com/steinbergmedia/vst3sdk.git third_party/vst3
          if (-not (Test-Path "third_party\vst3\pluginterfaces\vst\ivstaudioprocessor.h")) {
            throw "VST3 SDK fetch incomplete: pluginterfaces headers missing"
          }
          Write-Host "VST3 SDK fetched OK"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64 `
            -DSTGR_VST3_SDK_DIR="$env:GITHUB_WORKSPACE\third_party\vst3" `
            -DSTGR_VST3_FETCH=OFF `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run DSP benchmark
        shell: pwsh
        run: |
          .\build\bin\Release\STGRBench.exe | Tee-Object -FilePath benchmark.txt
          Get-Content benchmark.txt

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark.txt
          if-no-files-found: error

      - name: Verify APO DLL exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { Write-Warning "vswhere not found - skipping export check"; exit 0 }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { Write-Warning "dumpbin not found - skipping export check"; exit 0 }
          $exports = & $dumpbin.FullName /exports .\build\bin\Release\stgr_apo.dll
          foreach ($name in @("DllGetClassObject", "DllCanUnloadNow", "DllRegisterServer", "DllUnregisterServer")) {
            if ($exports -match $name) { Write-Host "$name OK" } else { throw "Missing export: $name" }
          }

      - name: Package installer
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Version "1.0.0"

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-ChildItem .\installer\dist\* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash *$($_.Name)" | Add-Content .\installer\dist\SHA256SUMS.txt
          }
          Get-Content .\installer\dist\SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stgr-microphone-equalizer-x64
          path: |
            build/bin/Release/*.exe
            build/bin/Release/stgr_apo.dll
            installer/dist/*
          if-no-files-found: error
